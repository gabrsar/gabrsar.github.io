<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hilbert Debug</title>
    <link rel="stylesheet" href="../common.css" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background:
          radial-gradient(
            circle at 50% 45%,
            rgba(26, 57, 112, 0.22),
            transparent 42%
          ),
          #05070b;
      }

      body {
        overflow: hidden;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: rgba(233, 242, 255, 0.92);
      }

      .debug-stage {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .debug-stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

    </style>
  </head>
  <body>
    <div class="debug-stage">
      <canvas
        id="hilbert-debug-canvas"
        data-hilbert-controls="on"
        aria-label="Hilbert debug canvas"
      ></canvas>
    </div>

    <a class="floating-home-btn" href="../index.html" aria-label="Voltar">
      &larr;
    </a>

    <script
      src="../assets/js/background-effects/hilbert-curve/effect.js"
      defer
    ></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("hilbert-debug-canvas");
        window.BackgroundEffects?.mountHilbertCurve?.(canvas);
      });
    </script>
  </body>
</html>
